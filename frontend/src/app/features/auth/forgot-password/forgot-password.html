<div class="forgot-password-container">
  <div class="forgot-password-card">

    <div class="logo-section">
      <h1 class="logo">🌾 Hassad</h1>
      <p class="tagline">Reset Your Password</p>
    </div>

    <!-- EMAIL STEP -->
    <div class="form-step">
      <h2 class="step-title">Forgot Password?</h2>
      <p class="step-description">
        Enter your email address and we will send you a reset code.
      </p>

      <form (ngSubmit)="requestReset()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="example@gmail.com"
            [disabled]="loading()"
            required
          />
        </div>

        <button type="submit" class="submit-btn" [disabled]="loading()">
          {{ loading() ? 'Sending...' : 'Send Reset Code' }}
        </button>
      </form>

      <div class="hint-text">
        After sending the reset code, you will be redirected to the password reset page.
      </div>
    </div>

    <!-- MESSAGES -->
    <div *ngIf="error()" class="error-message">
      ⚠️ {{ error() }}
    </div>

    <div *ngIf="success()" class="success-message">
      ✅ {{ success() }}
    </div>

    <div class="form-footer">
      <p>
        Remember your password?
        <a routerLink="/login">Sign In</a>
      </p>
    </div>

  </div>
</div>y
