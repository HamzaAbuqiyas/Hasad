<div class="reset-container">

  <div class="reset-card">

    <div class="reset-header">
      <h2>Reset Password</h2>
      <p *ngIf="step() === 'code'">
        Enter the verification code sent to your email.
      </p>

      <p *ngIf="step() === 'password'">
        Enter your new password.
      </p>

      <p *ngIf="step() === 'done'">
        Password changed successfully.
      </p>
    </div>

    <div class="alert error" *ngIf="error()">
      {{ error() }}
    </div>

    <div class="alert success" *ngIf="success()">
      {{ success() }}
    </div>

    <!-- STEP 1: VERIFY CODE -->
    <form *ngIf="step() === 'code'" (ngSubmit)="submitCode()">

      <div class="form-group">
        <label>Email</label>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        />
      </div>

      <div class="form-group">
        <label>Verification Code</label>
        <input
          type="text"
          name="code"
          [(ngModel)]="code"
          placeholder="Enter 6-digit code"
          maxlength="6"
          required
        />
      </div>

      <button type="submit" class="main-btn" [disabled]="loading()">
        {{ loading() ? 'Verifying...' : 'Verify Code' }}
      </button>

      <button type="button" class="link-btn" (click)="goToForgotPassword()">
        Send code again
      </button>

    </form>

    <!-- STEP 2: NEW PASSWORD -->
    <form *ngIf="step() === 'password'" (ngSubmit)="resetPassword()">

      <div class="form-group">
        <label>New Password</label>

        <div class="password-box">
          <input
            id="newPassword" #newPasswordInput
            [type]="showPassword() ? 'text' : 'password'"
            name="newPassword"
            [(ngModel)]="newPassword"
            placeholder="Enter new password"
            required
          />

          <button
            type="button"
            class="eye-btn"
            (click)="togglePasswordVisibility('password')">
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>

        <div class="password-box">
          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm new password"
            required
          />

          <button
            type="button"
            class="eye-btn"
            (click)="togglePasswordVisibility('confirm')">
            {{ showConfirmPassword() ? 'Hide' : 'Show' }}
          </button>
        </div>
      </div>

      <button type="submit" class="main-btn" [disabled]="loading()">
        {{ loading() ? 'Resetting...' : 'Reset Password' }}
      </button>

      <button type="button" class="link-btn" (click)="goBackToCode()">
        Back to code
      </button>

    </form>

    <!-- STEP 3: DONE -->
    <div *ngIf="step() === 'done'" class="done-box">
      <h3>Password Reset Successfully</h3>
      <p>You will be redirected to login.</p>

      <button type="button" class="main-btn" (click)="goToLogin()">
        Go to Login
      </button>
    </div>

  </div>

</div>
